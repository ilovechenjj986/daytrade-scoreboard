name: Capture AI Stock Map data

on:
  schedule:
    # 18:05-23:05 Asia/Taipei, Monday-Saturday.
    - cron: '5 10-15 * * 1-6'
    # 00:05-07:05 Asia/Taipei, Tuesday-Sunday (still belongs to the previous capture date).
    - cron: '5 16-23 * * 1-6'
    # 08:05-17:05 Asia/Taipei, Tuesday-Sunday (still belongs to the previous capture date).
    - cron: '5 0-9 * * 0,2-6'
  workflow_dispatch:
    inputs:
      force:
        description: Run even if all three views for the capture date are complete
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sector-scoreboard-pages
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'github-pages' || 'aistockmap-validation' }}
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether this date still needs views
        id: gate
        env:
          FORCE_CAPTURE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && 'true' || 'false' }}
        run: node scripts/aistockmap-capture-gate.cjs

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install browser dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Restore encrypted login state
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          AUTH_STATE_B64: ${{ secrets.AISTOCKMAP_AUTH_STATE_B64 }}
        run: |
          test -n "$AUTH_STATE_B64"
          printf '%s' "$AUTH_STATE_B64" | base64 --decode > "$RUNNER_TEMP/auth-state.json"

      - name: Capture structured list data
        if: steps.gate.outputs.run == 'true'
        env:
          AISTOCKMAP_AUTH_STATE_FILE: ${{ runner.temp }}/auth-state.json
          FORCE_CAPTURE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && 'true' || 'false' }}
        run: npm run capture:aistockmap

      - name: Commit data
        if: github.ref == 'refs/heads/main'
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- site/aistockmap; then
            echo 'No data changes.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/aistockmap
          git commit -m "Update AI Stock Map data $(TZ=Asia/Taipei date +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Upload branch validation artifact
        if: github.ref != 'refs/heads/main' && always()
        uses: actions/upload-artifact@v4
        with:
          name: aistockmap-data-validation
          path: site/aistockmap
      - if: github.ref == 'refs/heads/main' && steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - if: github.ref == 'refs/heads/main' && steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy GitHub Pages
        if: github.ref == 'refs/heads/main' && steps.commit.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
