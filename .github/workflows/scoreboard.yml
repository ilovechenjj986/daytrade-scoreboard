name: Update scoreboard, limit-up, rotation focus, and event watchlist

on:
  push:
    branches: [main]
  schedule:
    # 18:40 Asia/Taipei start, then retry every 10 minutes through 14:30 the next day.
    - cron: '40,50 10 * * 1-6'
    - cron: '*/10 11-23 * * 1-6'
    - cron: '*/10 0-5 * * 0,2-6'
    - cron: '0,10,20,30 6 * * 0,2-6'
  workflow_dispatch:
    inputs:
      force:
        description: Refresh the latest source data even if the date is unchanged
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sector-scoreboard-pages
  queue: max

jobs:
  update-and-deploy:
    runs-on: windows-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Capture scoreboard when source data changed
        id: scoreboard
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        shell: pwsh
        env:
          FORCE_CAPTURE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && 'true' || 'false' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceUrl = 'https://chengwaye.com/nextday-performance'
          $jsonPath = Join-Path $PWD 'site/sector_scoreboard.json'
          $baseline = ''
          $baselineStocks = ''
          if (Test-Path $jsonPath) {
            $baselineJson = (Get-Content -Raw -Encoding UTF8 $jsonPath).TrimStart([char]0xFEFF) | ConvertFrom-Json
            $baseline = $baselineJson.nextDate
            $baselineStocks = ConvertTo-Json -InputObject @($baselineJson.stocks) -Depth 10 -Compress
          }

          $probeDir = Join-Path $env:RUNNER_TEMP 'scoreboard-probe'
          & ./update_sector_scoreboard.ps1 -Url $sourceUrl -OutputDirectory $probeDir
          $probeJsonPath = Join-Path $probeDir 'sector_scoreboard.json'
          $probeJson = (Get-Content -Raw -Encoding UTF8 $probeJsonPath).TrimStart([char]0xFEFF) | ConvertFrom-Json
          $sourceStocks = ConvertTo-Json -InputObject @($probeJson.stocks) -Depth 10 -Compress
          $changed = ($probeJson.nextDate -ne $baseline) -or ($sourceStocks -ne $baselineStocks) -or ($env:FORCE_CAPTURE -eq 'true')

          if (-not $changed) {
            "changed=false" >> $env:GITHUB_OUTPUT
            Write-Host "No scoreboard data change for $($probeJson.nextDate); keeping the published files."
            exit 0
          }

          & ./update_sector_scoreboard.ps1 -Url $sourceUrl -OutputDirectory (Join-Path $PWD 'site')
          Copy-Item (Join-Path $PWD 'site/sector_scoreboard.html') (Join-Path $PWD 'site/index.html') -Force
          $updated = (Get-Content -Raw -Encoding UTF8 $jsonPath).TrimStart([char]0xFEFF) | ConvertFrom-Json
          if ($updated.nextDate -ne $probeJson.nextDate) {
            throw "Update verification failed: json=$($updated.nextDate), source=$($probeJson.nextDate)"
          }
          "changed=true" >> $env:GITHUB_OUTPUT
          "source_date=$($updated.nextDate)" >> $env:GITHUB_OUTPUT

      - name: Capture limit-up records
        id: limit_up
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          FORCE_CAPTURE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && 'true' || 'false' }}
        run: npm run capture:limit-up

      - name: Capture rotation focus
        id: rotation_focus
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          FORCE_CAPTURE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && 'true' || 'false' }}
        run: npm run capture:rotation-focus

      - name: Capture event watchlist
        id: event_watchlist
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          FORCE_CAPTURE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && 'true' || 'false' }}
        run: npm run capture:event-watchlist

      - name: Report capture results
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          {
            echo "## Daily data capture"
            echo "- Scoreboard: ${{ steps.scoreboard.outcome }} (changed: ${{ steps.scoreboard.outputs.changed || 'false' }})"
            echo "- Limit-up: ${{ steps.limit_up.outcome }}"
            echo "- Rotation focus: ${{ steps.rotation_focus.outcome }}"
            echo "- Event watchlist: ${{ steps.event_watchlist.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit changed data
        id: commit
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if git diff --quiet -- site/sector_scoreboard.json site/sector_scoreboard.csv site/sector_scoreboard.html site/index.html site/history site/limit-up site/rotation-focus site/event-watchlist; then
            echo 'No target data changes.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/sector_scoreboard.json site/sector_scoreboard.csv site/sector_scoreboard.html site/index.html site/history site/limit-up site/rotation-focus site/event-watchlist
          git commit -m "Update daily market data $(TZ=Asia/Taipei date +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - if: github.event_name == 'push' || steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - if: github.event_name == 'push' || steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy GitHub Pages
        if: github.event_name == 'push' || steps.commit.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
