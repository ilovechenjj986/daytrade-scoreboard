<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Stock Map 每日資料庫</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <nav class="app-switcher" aria-label="功能切換">
      <a href="../">族群記分板</a>
      <a class="active" href="./">AI Stock Map 每日資料</a>
      <a href="../limit-up/">每日漲停紀錄</a>
      <a href="../rotation-focus/">族群輪動焦點</a>
    </nav>
    <h1>AI Stock Map 每日資料庫</h1>
    <p class="sub">保存台股單日、單週、單月與美股單日；單日表的紫色 ★ 表示單週上漲、紅色 ★ 表示單月上漲，兩顆 ★ 表示兩者皆上漲，星號上方直接顯示對應漲幅；週月表維持黃色 ★，表示單日漲但該期下跌。任一族群漲跌幅差異達 1% 或族群增減就保存。</p>
    <section class="toolbar">
      <label for="snapshot-date">查看日期</label>
      <select id="snapshot-date"></select>
      <span id="status" role="status"></span>
    </section>
    <p id="meta" class="meta"></p>
    <div id="screens" class="screens"></div>
  </main>
  <script src="viewer.js?v=12"></script>
</body>
</html>
