<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="每日處置預測與法說、除權息事件標的，保存最近 30 個日期。">
  <title>事件型自選標的</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <nav class="app-switcher" aria-label="功能切換">
      <a href="../">族群記分板</a>
      <a href="../aistockmap/">AI Stock Map 每日資料</a>
      <a href="../limit-up/">每日漲停紀錄</a>
      <a href="../rotation-focus/">族群輪動焦點</a>
      <a class="active" href="./">事件型自選標的</a>
    </nav>
    <header>
      <p class="eyebrow">DAILY EVENT WATCHLIST</p>
      <h1>事件型自選標的</h1>
      <p class="sub">每日整理處置預測第 1 次標的，以及當日舉行法說、除權或除息的股票。法說區間只列起始日。</p>
    </header>
    <section class="toolbar">
      <label for="record-date">查看日期</label>
      <select id="record-date"></select>
      <span id="status" role="status" aria-live="polite"></span>
    </section>
    <section class="summary" aria-live="polite">
      <div><span class="summary-label">資料日期</span><strong id="summary-date">—</strong></div>
      <div><span class="summary-label">標的數</span><strong id="summary-count">—</strong></div>
      <div><span class="summary-label">事件數</span><strong id="summary-events">—</strong></div>
    </section>
    <section class="table-card">
      <div class="table-heading"><h2>標的清單</h2><div class="legend" aria-label="事件類型"><span class="badge disposal">進處置</span><span class="badge presentation">法說</span><span class="badge ex">除權息</span></div></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>事件</th><th>代號</th><th>名稱</th></tr></thead>
          <tbody id="records"></tbody>
        </table>
      </div>
      <p id="empty" class="empty" hidden>這一天沒有符合條件的標的。</p>
    </section>
    <p class="source">資料來源：<a href="https://chengwaye.com/" target="_blank" rel="noopener">盤前 LINE 轉貼版</a>、<a href="https://chengwaye.com/realtime-events" target="_blank" rel="noopener">Chengwaye 事件</a></p>
  </main>
  <script src="viewer.js?v=1"></script>
</body>
</html>
